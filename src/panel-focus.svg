<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Where the work goes: embedded firmware, machine learning, backend and data, frontend, and infrastructure — with a rolling activity trace.">
<defs>
  <style>
    __VARS__
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}

    /* bars grow to their share, then hold */
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .bar{transform-box:fill-box;transform-origin:left center;
      animation:grow 1.1s cubic-bezier(.16,.84,.24,1) backwards}

    /* a light runs along each filled bar */
    @keyframes shine{0%{transform:translateX(-60px);opacity:0}10%{opacity:.9}
      55%{opacity:.9}70%,100%{transform:translateX(520px);opacity:0}}
    .shine{animation:shine 9s cubic-bezier(.45,0,.35,1) infinite}

    /* activity trace draws itself, then the head keeps pulsing */
    @keyframes trace{0%{stroke-dashoffset:900}55%,100%{stroke-dashoffset:0}}
    .trace{stroke-dasharray:900;animation:trace 7s cubic-bezier(.4,.3,.2,1) infinite}
    @keyframes headIn{0%,50%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
    .head{animation:headIn 7s linear infinite}
    @keyframes headRing{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(2.8);opacity:0}}
    .headRing{transform-box:fill-box;transform-origin:center;animation:headRing 2.2s cubic-bezier(.2,.6,.3,1) infinite}

    /* column ticks flicker like recent commits */
    @keyframes tick{0%,100%{opacity:.25}50%{opacity:1}}
    .tick{animation:tick 5s ease-in-out infinite}

    @media (prefers-reduced-motion:reduce){
      .bar,.shine,.trace,.head,.headRing,.tick{animation:none!important}
      .bar{transform:none}
      .shine,.headRing{opacity:0}
      .trace{stroke-dashoffset:0}
      .head{opacity:1}
    }
  </style>

  <linearGradient id="fill1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--v)"/><stop offset="100%" stop-color="var(--c)"/>
  </linearGradient>
  <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sheenC)" stop-opacity="0"/>
    <stop offset="50%" stop-color="var(--sheenC)" stop-opacity=".6"/>
    <stop offset="100%" stop-color="var(--sheenC)" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="traceG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--v)"/><stop offset="100%" stop-color="var(--c)"/>
  </linearGradient>
  <clipPath id="barsClip"><rect x="240" y="70" width="520" height="180" rx="8"/></clipPath>
</defs>

<rect width="1280" height="300" rx="16" fill="var(--bg)"/>
<rect x=".75" y=".75" width="1278.5" height="298.5" rx="16" fill="none" stroke="var(--border)" stroke-width="1.5"/>

<text class="m" x="56" y="52" font-size="11.5" letter-spacing="1.7" fill="var(--label)">WHERE THE WORK GOES</text>

<!-- bars -->
<g>
  <text class="f" x="56" y="94"  font-size="13" fill="var(--text)">Embedded firmware</text>
  <rect x="240" y="82" width="520" height="9" rx="4.5" fill="var(--track)"/>
  <rect class="bar" x="240" y="82" width="452" height="9" rx="4.5" fill="url(#fill1)"/>

  <text class="f" x="56" y="134" font-size="13" fill="var(--text)">Machine learning</text>
  <rect x="240" y="122" width="520" height="9" rx="4.5" fill="var(--track)"/>
  <rect class="bar" x="240" y="122" width="388" height="9" rx="4.5" fill="url(#fill1)" style="animation-delay:.1s"/>

  <text class="f" x="56" y="174" font-size="13" fill="var(--text)">Backend &amp; data</text>
  <rect x="240" y="162" width="520" height="9" rx="4.5" fill="var(--track)"/>
  <rect class="bar" x="240" y="162" width="312" height="9" rx="4.5" fill="url(#fill1)" style="animation-delay:.2s"/>

  <text class="f" x="56" y="214" font-size="13" fill="var(--text)">Frontend</text>
  <rect x="240" y="202" width="520" height="9" rx="4.5" fill="var(--track)"/>
  <rect class="bar" x="240" y="202" width="244" height="9" rx="4.5" fill="url(#fill1)" style="animation-delay:.3s"/>

  <text class="f" x="56" y="254" font-size="13" fill="var(--text)">Infrastructure</text>
  <rect x="240" y="242" width="520" height="9" rx="4.5" fill="var(--track)"/>
  <rect class="bar" x="240" y="242" width="186" height="9" rx="4.5" fill="url(#fill1)" style="animation-delay:.4s"/>
</g>

<g clip-path="url(#barsClip)">
  <rect class="shine" x="240" y="78" width="60" height="178" fill="url(#shineG)"/>
</g>

<!-- activity trace -->
<text class="m" x="836" y="52" font-size="11.5" letter-spacing="1.7" fill="var(--label)">RECENT ACTIVITY</text>
<rect x="836" y="72" width="388" height="152" rx="12" fill="var(--panel)" stroke="var(--border)" stroke-width="1.5"/>

<g>
  <rect class="tick" x="862"  y="188" width="5" height="18" rx="2.5" fill="var(--v)" opacity=".25"/>
  <rect class="tick" x="878"  y="180" width="5" height="26" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-.4s"/>
  <rect class="tick" x="894"  y="192" width="5" height="14" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-.8s"/>
  <rect class="tick" x="910"  y="174" width="5" height="32" rx="2.5" fill="var(--c)" opacity=".25" style="animation-delay:-1.2s"/>
  <rect class="tick" x="926"  y="186" width="5" height="20" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-1.6s"/>
  <rect class="tick" x="942"  y="168" width="5" height="38" rx="2.5" fill="var(--c)" opacity=".25" style="animation-delay:-2s"/>
  <rect class="tick" x="958"  y="182" width="5" height="24" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-2.4s"/>
  <rect class="tick" x="974"  y="190" width="5" height="16" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-2.8s"/>
  <rect class="tick" x="990"  y="172" width="5" height="34" rx="2.5" fill="var(--c)" opacity=".25" style="animation-delay:-3.2s"/>
  <rect class="tick" x="1006" y="184" width="5" height="22" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-3.6s"/>
  <rect class="tick" x="1022" y="178" width="5" height="28" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-4s"/>
  <rect class="tick" x="1038" y="164" width="5" height="42" rx="2.5" fill="var(--c)" opacity=".25" style="animation-delay:-4.4s"/>
  <rect class="tick" x="1054" y="186" width="5" height="20" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-4.8s"/>
  <rect class="tick" x="1070" y="176" width="5" height="30" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-5.2s"/>
  <rect class="tick" x="1086" y="170" width="5" height="36" rx="2.5" fill="var(--c)" opacity=".25" style="animation-delay:-5.6s"/>
  <rect class="tick" x="1102" y="188" width="5" height="18" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-6s"/>
  <rect class="tick" x="1118" y="180" width="5" height="26" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-6.4s"/>
  <rect class="tick" x="1134" y="166" width="5" height="40" rx="2.5" fill="var(--c)" opacity=".25" style="animation-delay:-6.8s"/>
  <rect class="tick" x="1150" y="184" width="5" height="22" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-7.2s"/>
  <rect class="tick" x="1166" y="174" width="5" height="32" rx="2.5" fill="var(--c)" opacity=".25" style="animation-delay:-7.6s"/>
  <rect class="tick" x="1182" y="190" width="5" height="16" rx="2.5" fill="var(--v)" opacity=".25" style="animation-delay:-8s"/>
</g>

<path class="trace" d="M862 142 L894 128 L926 136 L958 112 L990 122 L1022 98 L1054 108 L1086 88 L1118 96 L1150 80 L1184 92"
      fill="none" stroke="url(#traceG)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="head">
  <circle class="headRing" cx="1184" cy="92" r="4" fill="var(--c)"/>
  <circle cx="1184" cy="92" r="4" fill="var(--c)"/>
</g>

<text class="m" x="836" y="250" font-size="10" fill="var(--muted)">The real contribution graph lives right below this README.</text>
</svg>
