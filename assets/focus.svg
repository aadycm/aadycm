<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="Focus: artificial intelligence, computational biology and quantitative finance.">
<defs>
  <style>
:root{
  --bg:#0D1117; --border:#30363D;
  --v:#8B5CF6; --c:#22D3EE; --live:#34D399; --washA:.13;
  --nameA:#F4F5F8; --text:#D7DAE1; --muted:#A8AEBB; --dim:#8F96A4;
  --sheenC:#FFFFFF; --sheenA:.75; --washB:.10; --pillLit:#4A5568;
  --gridC:#FFFFFF; --gridA:.022;
  --label:#8F96A4; --sep:#41454F; --chipStroke:#363C45;
  --panel:#11161D; --wire:#3A4250; --dotOff:#3A4250; --paper:#5A6472; --track:#20262F;
  --netLine:#3B4658; --netDot:#6D7A8C; --netSig:#22D3EE;
  --orbInk:#E7EAF0;
}
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}

    @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
    .in{animation:rise .8s cubic-bezier(.16,.84,.24,1) backwards}

    @keyframes edge{0%,100%{opacity:.5}50%{opacity:1}}
    .edge{animation:edge 7s ease-in-out infinite}

    /* each field gets a meter that fills once, so the tile settles rather than loops */
    @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .meter{transform-box:fill-box;transform-origin:left center;
      animation:fill 1.2s cubic-bezier(.16,.84,.24,1) backwards}

    /* one marker travels the three fields, the way attention actually works */
    @keyframes travel{0%,8%{transform:translateY(0);opacity:1}
      30%,41%{transform:translateY(54px)}63%,74%{transform:translateY(108px)}
      96%,100%{transform:translateY(0)}}
    .marker{animation:travel 9s cubic-bezier(.6,0,.4,1) infinite}

    @media (prefers-reduced-motion:reduce){
      .in,.meter,.edge,.marker{animation:none!important}
      .in,.meter{transform:none}
    }
  </style>
  <linearGradient id="glass" x1="0" y1="0" x2=".35" y2="1">
    <stop offset="0%" stop-color="var(--sheenC)" stop-opacity=".07"/>
    <stop offset="55%" stop-color="var(--sheenC)" stop-opacity=".015"/>
    <stop offset="100%" stop-color="var(--c)" stop-opacity=".05"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="var(--c)" stop-opacity=".5"/>
    <stop offset="45%" stop-color="var(--border)" stop-opacity=".9"/>
    <stop offset="100%" stop-color="var(--v)" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sheenC)" stop-opacity="0"/>
    <stop offset="50%" stop-color="var(--sheenC)" stop-opacity=".5"/>
    <stop offset="100%" stop-color="var(--sheenC)" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="420" height="260" rx="18" fill="var(--panel)"/>
<rect width="420" height="260" rx="18" fill="url(#glass)"/>
<rect class="edge" x=".75" y=".75" width="418.5" height="258.5" rx="17.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
<rect x="28" y="1" width="364" height="1" fill="url(#sheen)"/>

<g class="in">
  <text class="m" x="32" y="42" font-size="10" letter-spacing="1.8" fill="var(--label)">FOCUS</text>
</g>

<g class="marker"><circle cx="37" cy="86" r="3" fill="var(--c)"/></g>

<g class="in" style="animation-delay:.1s">
  <text class="f" x="54" y="90" font-size="14" font-weight="500" fill="var(--text)">Artificial Intelligence</text>
  <rect x="54" y="102" width="320" height="3" rx="1.5" fill="var(--track)"/>
  <rect class="meter" x="54" y="102" width="320" height="3" rx="1.5" fill="var(--v)" opacity=".85"/>
</g>

<g class="in" style="animation-delay:.2s">
  <text class="f" x="54" y="144" font-size="14" font-weight="500" fill="var(--text)">Computational Biology</text>
  <rect x="54" y="156" width="320" height="3" rx="1.5" fill="var(--track)"/>
  <rect class="meter" x="54" y="156" width="320" height="3" rx="1.5" fill="var(--c)" opacity=".85" style="animation-delay:.12s"/>
</g>

<g class="in" style="animation-delay:.3s">
  <text class="f" x="54" y="198" font-size="14" font-weight="500" fill="var(--text)">Quantitative Finance</text>
  <rect x="54" y="210" width="320" height="3" rx="1.5" fill="var(--track)"/>
  <rect class="meter" x="54" y="210" width="320" height="3" rx="1.5" fill="var(--live)" opacity=".85" style="animation-delay:.24s"/>
</g>

<g class="in" style="animation-delay:.4s">
  <text class="m" x="32" y="242" font-size="10" fill="var(--dim)">models, cells, markets — same maths, different noise</text>
</g>
</svg>
