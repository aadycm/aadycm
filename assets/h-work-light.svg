<svg xmlns="http://www.w3.org/2000/svg" width="880" height="118" viewBox="0 0 880 118" role="img" aria-label="SELECTED WORK: Measured, not claimed.">
<defs>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(757 0) scale(484 130)">
<stop offset="0" stop-color="#A65F00" stop-opacity=".16"/><stop offset="1" stop-color="#A65F00" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#1F2328" fill-opacity=".06"/></pattern>

</defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif;fill:#1F2328}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace} .mono:not([letter-spacing]){letter-spacing:.14em}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.ink{fill:#1F2328} .muted{fill:#A7937C} .faint{fill:#59636E} .acc{fill:#A65F00} .warn{fill:#FF6B5A}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.run{animation:run 6s cubic-bezier(.45,0,.2,1) infinite}
@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateX(800px);opacity:0}}
</style>

<rect x="4" y="22" width="7" height="7" fill="#A65F00"/>
<text x="20" y="30" class="mono acc" font-size="11">01  SELECTED WORK</text>
<text x="876" y="30" class="mono faint" font-size="10" text-anchor="end">FULL WRITE-UPS LIVE IN EACH REPO</text>
<text x="2" y="82" class="serif" font-size="40">Measured, not claimed.</text>
<line x1="4" x2="876" y1="104" y2="104" stroke="#D1D9E0"/>
<line x1="4" x2="180" y1="104" y2="104" stroke="#A65F00"/>
<circle class="run" cx="40" cy="104" r="2.5" fill="#A65F00"/>

</svg>
