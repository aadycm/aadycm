<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="Right now: teaching HydroNode to look at the plants instead of just measuring the air. Figuring out: how small a model can get before it stops being useful on a board with no GPU.">
<defs>
  <style>
:root{
  --bg:#F3EEE4; --border:#CDC2AD;
  --v:#B23E08; --c:#1F4E5F; --live:#41602C; --washA:.05;
  --nameA:#15120E; --text:#2A251D; --muted:#51493C; --dim:#6B6355;
  --sheenC:#B23E08; --sheenA:.35; --washB:.04; --pillLit:#B23E08;
  --gridC:#15120E; --gridA:.035;
  --label:#6B6355; --sep:#C2B7A2; --chipStroke:#CDC2AD;
  --panel:#FBF8F2; --wire:#B9AF9C; --dotOff:#C2B7A2; --paper:#8C8373; --track:#E5DDCE;
  --netLine:#CFC5B2; --netDot:#A89C86; --netSig:#B23E08;
  --orbInk:#15120E;
}
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}
    .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}

    @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
    .in{animation:rise .8s cubic-bezier(.16,.84,.24,1) backwards}

    @keyframes spine{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .spine{transform-box:fill-box;transform-origin:top center;
      animation:spine 1.1s cubic-bezier(.16,.84,.24,1) backwards}

    /* live dot for the thing being worked on, question mark beat for the open one */
    @keyframes live{0%,100%{opacity:.4;r:2.4}50%{opacity:1;r:3.4}}
    .live{animation:live 2.6s ease-in-out infinite}
    @keyframes seek{0%,100%{opacity:.35}50%{opacity:.9}}
    .seek{animation:seek 4.2s ease-in-out infinite}

    @media (prefers-reduced-motion:reduce){
      .in,.spine,.live,.seek{animation:none!important}
      .in,.spine{transform:none}
    }
  </style>
</defs>

<rect width="420" height="260" rx="3" fill="var(--panel)"/>
<rect x=".5" y=".5" width="419" height="259" rx="2.5" fill="none" stroke="var(--border)" stroke-width="1"/>
<rect class="spine" x="0" y="0" width="3" height="260" fill="var(--v)"/>

<g class="in">
  <circle class="live" cx="37" cy="38" r="2.4" fill="var(--live)"/>
  <text class="m" x="50" y="42" font-size="10" letter-spacing="1.8" fill="var(--label)">RIGHT NOW</text>
</g>

<g class="in" style="animation-delay:.1s">
  <text class="f" x="32" y="76" font-size="13.5" font-weight="500" fill="var(--text)">Teaching HydroNode to look at</text>
  <text class="f" x="32" y="98" font-size="13.5" font-weight="500" fill="var(--text)">the plants instead of just</text>
  <text class="f" x="32" y="120" font-size="13.5" font-weight="500" fill="var(--text)">measuring the air.</text>
</g>

<g class="in" style="animation-delay:.18s">
  <rect x="32" y="144" width="356" height="1" fill="var(--border)"/>
</g>

<g class="in" style="animation-delay:.26s">
  <text class="m seek" x="32" y="170" font-size="10" letter-spacing="1.8" fill="var(--label)">FIGURING OUT</text>
  <text class="f" x="32" y="196" font-size="13.5" fill="var(--muted)">How small a model can get before</text>
  <text class="f" x="32" y="218" font-size="13.5" fill="var(--muted)">it stops being useful on a board</text>
  <text class="f" x="32" y="240" font-size="13.5" fill="var(--muted)">with no GPU.</text>
</g>
</svg>
