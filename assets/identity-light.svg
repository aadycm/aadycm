<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="Aadithya Chandramouli, fourth year computer science student at Penn State University, based in India.">
<defs>
  <style>
:root{
  --bg:#F3EEE4; --border:#CDC2AD;
  --v:#B23E08; --c:#1F4E5F; --live:#41602C; --washA:.05;
  --nameA:#15120E; --text:#2A251D; --muted:#51493C; --dim:#6B6355;
  --sheenC:#B23E08; --sheenA:.35; --washB:.04; --pillLit:#B23E08;
  --gridC:#15120E; --gridA:.035;
  --label:#6B6355; --sep:#C2B7A2; --chipStroke:#CDC2AD;
  --panel:#FBF8F2; --wire:#B9AF9C; --dotOff:#C2B7A2; --paper:#8C8373; --track:#E5DDCE;
  --netLine:#CFC5B2; --netDot:#A89C86; --netSig:#B23E08;
  --orbInk:#15120E;
}
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}
    .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}

    /* every tile in the grid reveals the same way: up and slightly in */
    @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}
      to{opacity:1;transform:none}}
    .in{animation:rise .8s cubic-bezier(.16,.84,.24,1) backwards}

    /* the 1px edge breathes instead of sitting flat, which is what sells glass */
    @keyframes spine{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .spine{transform-box:fill-box;transform-origin:top center;
      animation:spine 1.1s cubic-bezier(.16,.84,.24,1) backwards}

    @keyframes blip{0%,100%{opacity:.35;r:2}50%{opacity:1;r:2.8}}
    .blip{animation:blip 3.4s ease-in-out infinite}

    @media (prefers-reduced-motion:reduce){
      .in,.spine,.blip{animation:none!important}
      .in,.spine{transform:none}
    }
  </style>
</defs>

<rect width="420" height="260" rx="3" fill="var(--panel)"/>
<rect x=".5" y=".5" width="419" height="259" rx="2.5" fill="none" stroke="var(--border)" stroke-width="1"/>
<rect class="spine" x="0" y="0" width="3" height="260" fill="var(--v)"/>

<g class="in">
  <text class="m" x="32" y="42" font-size="10" letter-spacing="1.8" fill="var(--label)">PROFILE</text>
</g>

<g class="in" style="animation-delay:.08s">
  <text class="d" x="32" y="84" font-size="24" font-weight="400" fill="var(--nameA)">Aadithya</text>
  <text class="d" x="32" y="112" font-size="24" font-weight="400" fill="var(--nameA)">Chandramouli</text>
</g>

<g class="in" style="animation-delay:.16s">
  <rect x="32" y="134" width="40" height="1.5" rx="1" fill="var(--v)" opacity=".8"/>
</g>

<g class="in" style="animation-delay:.22s">
  <text class="f" x="32" y="168" font-size="13" font-weight="500" fill="var(--text)">4th-year Computer Science</text>
  <text class="f" x="32" y="190" font-size="13" fill="var(--muted)">Penn State University</text>
</g>

<g class="in" style="animation-delay:.3s">
  <circle class="blip" cx="37" cy="216" r="2" fill="var(--v)"/>
  <text class="m" x="50" y="220" font-size="10.5" fill="var(--muted)">INDIA</text>
</g>
</svg>
