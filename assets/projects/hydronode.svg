<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 608" width="800" height="608" role="img" aria-label="HydroNode architecture: five growing nodes and a camera feed a live path, a history path and an on-device vision path, all converging on one dashboard.">
<defs>
  <style>
:root{
  --bg:#0D1117; --border:#30363D;
  --v:#8B5CF6; --c:#22D3EE; --live:#34D399; --washA:.13;
  --nameA:#F4F5F8; --text:#D7DAE1; --muted:#A8AEBB; --dim:#8F96A4;
  --sheenC:#FFFFFF; --sheenA:.75; --washB:.10; --pillLit:#4A5568;
  --gridC:#FFFFFF; --gridA:.022;
  --label:#8F96A4; --sep:#41454F; --chipStroke:#363C45;
  --panel:#11161D; --wire:#3A4250; --dotOff:#3A4250; --paper:#5A6472; --track:#20262F;
  --netLine:#3B4658; --netDot:#6D7A8C; --netSig:#22D3EE;
  --orbInk:#E7EAF0;
}
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
    .box{fill:var(--panel);stroke:var(--border);stroke-width:1.5}
    .wire{fill:none;stroke:var(--wire);stroke-width:1.5}

    @keyframes pktA{0%{transform:translate(0,0);opacity:0}8%{opacity:1}20%{transform:translate(26px,0)}
      81%{transform:translate(26px,-80px)}92%{opacity:1}100%{transform:translate(50px,-80px);opacity:0}}
    @keyframes pktB{0%{transform:translate(0,0);opacity:0}8%{opacity:1}17%{transform:translate(40px,0)}
      83%{transform:translate(40px,156px)}92%{opacity:1}100%{transform:translate(80px,156px);opacity:0}}
    @keyframes pktC{0%{transform:translate(0,0);opacity:0}8%{opacity:1}39%{transform:translate(26px,0)}
      64%{transform:translate(26px,16px)}92%{opacity:1}100%{transform:translate(50px,16px);opacity:0}}
    @keyframes pktD{0%{transform:translate(0,0);opacity:0}10%{opacity:1}44%{transform:translate(40px,0)}
      57%{transform:translate(40px,12px)}90%{opacity:1}100%{transform:translate(80px,12px);opacity:0}}
    @keyframes pktE{0%{transform:translate(0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(50px,0);opacity:0}}
    @keyframes pktF{0%{transform:translate(0,0);opacity:0}8%{opacity:1}18%{transform:translate(40px,0)}
      82%{transform:translate(40px,-144px)}92%{opacity:1}100%{transform:translate(80px,-144px);opacity:0}}

    .pA{animation:pktA 2.4s linear infinite}
    .pB{animation:pktB 2.4s linear .55s infinite}
    .pC{animation:pktC 8s linear 1s infinite}
    .pD{animation:pktD 8s linear 1.9s infinite}
    .pE{animation:pktE 5s linear .4s infinite}
    .pF{animation:pktF 5s linear 1.3s infinite}

    @keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3);opacity:0}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(.2,.6,.3,1) infinite}
    @keyframes beat{0%,100%{opacity:1}50%{opacity:.55}}
    .beat{animation:beat 2.4s ease-in-out infinite}

    @keyframes hotGlow{0%,100%{stroke:var(--border)}22%,38%{stroke:var(--c)}}
    .hot{animation:hotGlow 2.4s ease-in-out infinite}
    @keyframes coldGlow{0%,100%{stroke:var(--border)}26%,40%{stroke:var(--v)}}
    .cold{animation:coldGlow 8s ease-in-out 1s infinite}
    @keyframes visGlow{0%,100%{stroke:var(--border)}24%,40%{stroke:var(--live)}}
    .vis{animation:visGlow 5s ease-in-out .4s infinite}

    /* camera: a scan line sweeps the frame, then a detection box locks on */
    @keyframes scanline{0%{transform:translateY(0);opacity:0}10%{opacity:1}
      60%{transform:translateY(34px);opacity:1}70%,100%{opacity:0}}
    .scanline{animation:scanline 5s cubic-bezier(.4,0,.4,1) infinite}
    @keyframes lock{0%,58%{opacity:0;transform:scale(.9)}68%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}
    .lock{transform-box:fill-box;transform-origin:center;animation:lock 5s ease-out infinite}

    @keyframes bars{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:bars 4s ease-in-out infinite}

    @media (prefers-reduced-motion:reduce){
      .pA,.pB,.pC,.pD,.pE,.pF,.ping,.beat,.hot,.cold,.vis,.scanline,.lock,.bar{animation:none!important}
      .pA,.pB,.pC,.pD,.pE,.pF,.ping,.scanline{opacity:0}
      .lock{opacity:1;transform:none}
      .bar{transform:none}
    }
  </style>
  <clipPath id="camClip"><rect x="60" y="436" width="76" height="36" rx="5"/></clipPath>
</defs>

<rect width="800" height="600" rx="14" fill="var(--bg)"/>
<rect x=".75" y=".75" width="798.5" height="598.5" rx="14" fill="none" stroke="var(--border)" stroke-width="1.5"/>

<text class="m" x="40" y="46" font-size="12" letter-spacing="1.8" fill="var(--label)">HYDRONODE.IN</text>
<text class="f" x="40" y="76" font-size="17" font-weight="600" fill="var(--nameA)">Five nodes, three paths, one dashboard</text>

<!-- wires -->
<path class="wire" d="M260 220 H286 V140 H310"/>
<path class="wire" d="M260 268 H286 V284 H310"/>
<path class="wire" d="M260 440 H310"/>
<path class="wire" d="M500 140 H540 V296 H580"/>
<path class="wire" d="M500 284 H540 V296 H580"/>
<path class="wire" d="M500 440 H540 V296 H580"/>

<!-- growing nodes — 48px pitch, five rows -->
<rect class="box" x="40" y="104" width="220" height="280" rx="12"/>
<text class="m" x="60" y="130" font-size="10.5" letter-spacing="1.5" fill="var(--label)">GROWING NODES</text>

<g>
  <circle class="ping" cx="66" cy="154" r="3.5" fill="var(--live)"/>
  <circle class="beat" cx="66" cy="154" r="3.5" fill="var(--live)"/>
  <text class="f" x="82" y="158" font-size="12.5" font-weight="500" fill="var(--text)">NFT hydroponics</text>
  <text class="m" x="82" y="172" font-size="9.5" fill="var(--muted)">Arduino Nano ESP32</text>
</g>
<g>
  <circle class="ping" cx="66" cy="202" r="3.5" fill="var(--live)" style="animation-delay:.5s"/>
  <circle class="beat" cx="66" cy="202" r="3.5" fill="var(--live)" style="animation-delay:.5s"/>
  <text class="f" x="82" y="206" font-size="12.5" font-weight="500" fill="var(--text)">Drip terrace</text>
  <text class="m" x="82" y="220" font-size="9.5" fill="var(--muted)">Arduino Uno R4 WiFi</text>
</g>
<g>
  <circle class="ping" cx="66" cy="250" r="3.5" fill="var(--live)" style="animation-delay:1s"/>
  <circle class="beat" cx="66" cy="250" r="3.5" fill="var(--live)" style="animation-delay:1s"/>
  <text class="f" x="82" y="254" font-size="12.5" font-weight="500" fill="var(--text)">Sprinkler farm</text>
  <text class="m" x="82" y="268" font-size="9.5" fill="var(--muted)">ESP32-WROOM-32</text>
</g>
<g>
  <circle class="ping" cx="66" cy="298" r="3.5" fill="var(--live)" style="animation-delay:1.5s"/>
  <circle class="beat" cx="66" cy="298" r="3.5" fill="var(--live)" style="animation-delay:1.5s"/>
  <text class="f" x="82" y="302" font-size="12.5" font-weight="500" fill="var(--text)">Aeroponic roses</text>
  <text class="m" x="82" y="316" font-size="9.5" fill="var(--muted)">ESP32-S3</text>
</g>
<g>
  <circle class="ping" cx="66" cy="346" r="3.5" fill="var(--v)" style="animation-delay:2s"/>
  <circle class="beat" cx="66" cy="346" r="3.5" fill="var(--v)" style="animation-delay:2s"/>
  <text class="f" x="82" y="350" font-size="12.5" font-weight="500" fill="var(--text)">Saffron chamber</text>
  <text class="m" x="82" y="364" font-size="9.5" fill="var(--muted)">ESP32-C6</text>
</g>

<!-- camera -->
<rect class="box" x="40" y="404" width="220" height="84" rx="12"/>
<text class="m" x="60" y="428" font-size="10.5" letter-spacing="1.5" fill="var(--label)">CAMERA</text>
<rect x="60" y="436" width="76" height="36" rx="5" fill="none" stroke="var(--wire)" stroke-width="1.5"/>
<g clip-path="url(#camClip)">
  <rect class="scanline" x="60" y="436" width="76" height="1.5" fill="var(--live)"/>
</g>
<rect class="lock" x="80" y="446" width="28" height="18" rx="3" fill="none" stroke="var(--live)" stroke-width="1.5"/>
<text class="f" x="150" y="450" font-size="11.5" fill="var(--text)">leaf stress</text>
<text class="f" x="150" y="466" font-size="11.5" fill="var(--text)">bloom stage</text>

<!-- hot path -->
<rect class="box hot" x="310" y="104" width="190" height="72" rx="12"/>
<text class="m" x="330" y="128" font-size="10.5" letter-spacing="1.5" fill="var(--c)">HOT PATH</text>
<text class="f" x="330" y="148" font-size="12.5" font-weight="500" fill="var(--text)">Firebase RTDB</text>
<text class="m" x="330" y="164" font-size="9.5" fill="var(--muted)">live stream · onValue</text>

<!-- cold path -->
<rect class="box cold" x="310" y="248" width="190" height="72" rx="12"/>
<text class="m" x="330" y="272" font-size="10.5" letter-spacing="1.5" fill="var(--v)">COLD PATH</text>
<text class="f" x="330" y="292" font-size="12.5" font-weight="500" fill="var(--text)">Apps Script → Sheets</text>
<text class="m" x="330" y="308" font-size="9.5" fill="var(--muted)">30-day rolling history</text>

<!-- vision path -->
<rect class="box vis" x="310" y="404" width="190" height="72" rx="12"/>
<text class="m" x="330" y="428" font-size="10.5" letter-spacing="1.5" fill="var(--live)">VISION PATH</text>
<text class="f" x="330" y="448" font-size="12.5" font-weight="500" fill="var(--text)">On-device inference</text>
<text class="m" x="330" y="464" font-size="9.5" fill="var(--muted)">frame in, label out</text>

<!-- dashboard -->
<rect class="box" x="580" y="216" width="180" height="160" rx="12"/>
<text class="m" x="600" y="242" font-size="10.5" letter-spacing="1.5" fill="var(--label)">DASHBOARD</text>
<g transform="translate(600,260)">
  <rect class="bar" x="0"   y="0" width="14" height="54" rx="3" fill="var(--c)" opacity=".75"/>
  <rect class="bar" x="24"  y="0" width="14" height="54" rx="3" fill="var(--c)" opacity=".6" style="animation-delay:-.7s"/>
  <rect class="bar" x="48"  y="0" width="14" height="54" rx="3" fill="var(--v)" opacity=".7" style="animation-delay:-1.4s"/>
  <rect class="bar" x="72"  y="0" width="14" height="54" rx="3" fill="var(--v)" opacity=".55" style="animation-delay:-2.1s"/>
  <rect class="bar" x="96"  y="0" width="14" height="54" rx="3" fill="var(--live)" opacity=".6" style="animation-delay:-2.8s"/>
  <rect class="bar" x="120" y="0" width="14" height="54" rx="3" fill="var(--c)" opacity=".65" style="animation-delay:-3.4s"/>
</g>
<text class="m" x="600" y="342" font-size="9.5" fill="var(--muted)">live · 30d history · alerts</text>

<!-- packets -->
<g fill="var(--c)"><circle class="pA" cx="260" cy="220" r="3.5"/></g>
<g fill="var(--c)"><circle class="pB" cx="500" cy="140" r="3.5"/></g>
<g fill="var(--v)"><circle class="pC" cx="260" cy="268" r="3.5"/></g>
<g fill="var(--v)"><circle class="pD" cx="500" cy="284" r="3.5"/></g>
<g fill="var(--live)"><circle class="pE" cx="260" cy="440" r="3.5"/></g>
<g fill="var(--live)"><circle class="pF" cx="500" cy="440" r="3.5"/></g>

<text class="m" x="40" y="528" font-size="10.5" fill="var(--muted)">Watering logic runs on each board — the network is for reporting, never for deciding.</text>
<text class="m" x="40" y="548" font-size="10.5" fill="var(--muted)">WiFi drops: rows spool on-device and replay later with their real timestamps.</text>
<text class="m" x="40" y="568" font-size="10.5" fill="var(--muted)">Frames are classified on the node; only the label leaves the property.</text>
</svg>
