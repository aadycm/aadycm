<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 528" width="800" height="528" role="img" aria-label="Agent reliability: a tool-using agent loop run under three stress conditions, with success falling from 100 percent at baseline to 38 percent when search results are degraded.">
<defs>
  <style>
:root{
  --bg:#FFFFFF; --border:#D1D9E0;
  --v:#7C3AED; --c:#0E7490; --live:#059669; --washA:.05;
  --nameA:#0D0E11; --text:#33373F; --muted:#565C68; --dim:#666C79;
  --sheenC:#A78BFA; --sheenA:.55; --washB:.05; --pillLit:#A78BFA;
  --gridC:#0D1117; --gridA:.04;
  --label:#666C79; --sep:#C6CAD2; --chipStroke:#D8DCE2;
  --panel:#F8FAFC; --wire:#C3C9D4; --dotOff:#C3C9D4; --paper:#9AA2B0; --track:#EDEFF3;
  --netLine:#CBD2DC; --netDot:#98A1B0; --netSig:#0E7490;
  --orbInk:#12141A;
}
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
    .box{fill:var(--panel);stroke:var(--border);stroke-width:1.5}
    .wire{fill:none;stroke:var(--wire);stroke-width:1.5}

    /* the loop: model calls a tool, result comes back, round again */
    @keyframes outbound{0%{transform:translate(0,0);opacity:0}8%{opacity:1}
      46%{transform:translate(146px,0);opacity:1}54%{opacity:0}100%{transform:translate(146px,0);opacity:0}}
    @keyframes inbound{0%,50%{transform:translate(0,0);opacity:0}58%{opacity:1}
      96%{transform:translate(-146px,0);opacity:1}100%{opacity:0}}
    .out{animation:outbound 3.2s cubic-bezier(.4,0,.5,1) infinite}
    .in{animation:inbound 3.2s cubic-bezier(.4,0,.5,1) infinite}

    @keyframes think{0%,100%{stroke:var(--border)}30%,45%{stroke:var(--c)}}
    .model{animation:think 3.2s ease-in-out infinite}
    @keyframes act{0%,100%{stroke:var(--border)}55%,70%{stroke:var(--live)}}
    .tools{animation:act 3.2s ease-in-out infinite}

    /* bars grow to the measured success rate */
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .bar{transform-box:fill-box;transform-origin:left center;
      animation:grow 1.1s cubic-bezier(.16,.84,.24,1) backwards}

    /* the failure that cost the most: the same query asked again and again */
    @keyframes reask{0%,100%{opacity:.25}50%{opacity:1}}
    .reask{animation:reask 2.4s ease-in-out infinite}

    @media (prefers-reduced-motion:reduce){
      .out,.in,.model,.tools,.bar,.reask{animation:none!important}
      .out,.in{opacity:0}
      .bar{transform:none}
    }
  </style>
</defs>

<rect width="800" height="528" rx="14" fill="var(--bg)"/>
<rect x=".75" y=".75" width="798.5" height="518.5" rx="14" fill="none" stroke="var(--border)" stroke-width="1.5"/>

<text class="m" x="40" y="46" font-size="12" letter-spacing="1.8" fill="var(--label)">AGENT RELIABILITY</text>
<text class="f" x="40" y="76" font-size="17" font-weight="600" fill="var(--nameA)">Where a tool-using agent actually breaks</text>

<!-- the loop -->
<path class="wire" d="M228 128 H346"/>
<path class="wire" d="M346 176 H228"/>

<rect class="box model" x="40" y="104" width="188" height="96" rx="12"/>
<text class="m" x="60" y="130" font-size="10.5" letter-spacing="1.5" fill="var(--c)">MODEL</text>
<text class="f" x="60" y="152" font-size="12.5" font-weight="500" fill="var(--text)">plans the next step</text>
<text class="m" x="60" y="172" font-size="9.5" fill="var(--muted)">native function calling</text>
<text class="m" x="60" y="190" font-size="9.5" fill="var(--muted)">max 12 steps</text>

<rect class="box tools" x="346" y="104" width="188" height="96" rx="12"/>
<text class="m" x="366" y="130" font-size="10.5" letter-spacing="1.5" fill="var(--live)">TOOLS</text>
<text class="f" x="366" y="152" font-size="12.5" font-weight="500" fill="var(--text)">search · files · python</text>
<text class="m" x="366" y="172" font-size="9.5" fill="var(--muted)">sandboxed</text>
<text class="m" x="366" y="190" font-size="9.5" fill="var(--muted)">every call traced</text>

<g fill="var(--c)"><circle class="out" cx="232" cy="128" r="3.5"/></g>
<g fill="var(--live)"><circle class="in" cx="342" cy="176" r="3.5"/></g>

<text class="m" x="248" y="122" font-size="9" fill="var(--muted)">call</text>
<text class="m" x="248" y="192" font-size="9" fill="var(--muted)">result</text>

<!-- the stress knobs -->
<rect class="box" x="576" y="104" width="184" height="96" rx="12"/>
<text class="m" x="596" y="130" font-size="10.5" letter-spacing="1.5" fill="var(--v)">STRESS</text>
<text class="f" x="596" y="150" font-size="11.5" fill="var(--text)">flaky tools</text>
<text class="f" x="596" y="168" font-size="11.5" fill="var(--text)">tight step budget</text>
<text class="f" x="596" y="186" font-size="11.5" fill="var(--text)">degraded search</text>

<!-- measured outcomes -->
<text class="m" x="40" y="248" font-size="10.5" letter-spacing="1.5" fill="var(--label)">SUCCESS ON 23 TASKS · GEMMA 4 26B</text>

<g>
  <text class="f" x="40" y="286" font-size="12" fill="var(--text)">baseline</text>
  <rect x="210" y="276" width="440" height="10" rx="5" fill="var(--track)"/>
  <rect class="bar" x="210" y="276" width="440" height="10" rx="5" fill="var(--live)" opacity=".85"/>
  <text class="m" x="664" y="286" font-size="11" fill="var(--muted)">100%</text>

  <text class="f" x="40" y="318" font-size="12" fill="var(--text)">flaky tools</text>
  <rect x="210" y="308" width="440" height="10" rx="5" fill="var(--track)"/>
  <rect class="bar" x="210" y="308" width="402" height="10" rx="5" fill="var(--c)" opacity=".8" style="animation-delay:.1s"/>
  <text class="m" x="664" y="318" font-size="11" fill="var(--muted)">91.3%</text>

  <text class="f" x="40" y="350" font-size="12" fill="var(--text)">tight budget</text>
  <rect x="210" y="340" width="440" height="10" rx="5" fill="var(--track)"/>
  <rect class="bar" x="210" y="340" width="325" height="10" rx="5" fill="var(--c)" opacity=".65" style="animation-delay:.2s"/>
  <text class="m" x="664" y="350" font-size="11" fill="var(--muted)">73.9%</text>

  <text class="f" x="40" y="382" font-size="12" fill="var(--text)">degraded search</text>
  <rect x="210" y="372" width="440" height="10" rx="5" fill="var(--track)"/>
  <rect class="bar" x="210" y="372" width="168" height="10" rx="5" fill="var(--v)" style="animation-delay:.3s"/>
  <text class="m" x="664" y="382" font-size="11" fill="var(--v)">38.1%</text>
</g>

<!-- the dominant failure -->
<g class="reask">
  <text class="m" x="40" y="424" font-size="10" fill="var(--muted)">same question, reworded</text>
  <text class="m" x="210" y="424" font-size="10" fill="var(--v)">"Brightwater Rail" &#8594; "... speed" &#8594; "... km" &#8594; "... miles" &#8594; out of steps</text>
</g>

<text class="m" x="40" y="456" font-size="10.5" fill="var(--muted)">Bad information breaks it far harder than broken tools do.</text>
<text class="m" x="40" y="474" font-size="10.5" fill="var(--muted)">It retried through 42 injected tool failures and lost only 2 tasks.</text>
<text class="m" x="40" y="492" font-size="10.5" fill="var(--muted)">It never once said it could not find the answer.</text>
</svg>
