<style>
.serif{font-family:Georgia,'Times New Roman',serif;fill:#F7ECDE}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace} .mono:not([letter-spacing]){letter-spacing:.14em}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.ink{fill:#F7ECDE} .muted{fill:#A7937C} .faint{fill:#7B6851} .acc{fill:#FFB547} .warn{fill:#FF6B5A}
