<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -11 1280 191" width="1280" height="191" role="img" aria-label="Have an interesting problem? Let's talk.">
<defs>
  <style>
:root{
  --bg:#FFFFFF; --border:#D1D9E0;
  --v:#7C3AED; --c:#0E7490; --live:#059669; --washA:.05;
  --nameA:#0D0E11; --text:#33373F; --muted:#565C68; --dim:#666C79;
  --sheenC:#A78BFA; --sheenA:.55; --washB:.05; --pillLit:#A78BFA;
  --gridC:#0D1117; --gridA:.04;
  --label:#666C79; --sep:#C6CAD2; --chipStroke:#D8DCE2;
  --panel:#F8FAFC; --wire:#C3C9D4; --dotOff:#C3C9D4; --paper:#9AA2B0; --track:#EDEFF3;
  --netLine:#CBD2DC; --netDot:#98A1B0; --netSig:#0E7490;
  --orbInk:#12141A;
}
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}

    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .in{animation:rise .8s cubic-bezier(.16,.84,.24,1) backwards}
    .d1{animation-delay:0s}.d2{animation-delay:.12s}.d3{animation-delay:.24s}

    @keyframes nudge{0%,72%,100%{transform:translateX(0)}84%{transform:translateX(4px)}}
    .arrow{animation:nudge 3.6s cubic-bezier(.3,.7,.3,1) infinite}

    @keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
    .halo{transform-box:fill-box;transform-origin:center;animation:breathe 12s ease-in-out infinite}

    @keyframes sheen{0%{transform:translateX(-420px)}45%,100%{transform:translateX(420px)}}
    .sheen{animation:sheen 8s cubic-bezier(.45,0,.3,1) 2s infinite}

    @keyframes pillGlow{0%,100%{stroke:var(--border)}50%{stroke:var(--pillLit)}}
    .pill{animation:pillGlow 4.5s ease-in-out infinite}

    @keyframes runBorder{to{stroke-dashoffset:-2920}}
    .runner{stroke-dasharray:200 2720;animation:runBorder 8s linear infinite}

    @keyframes edgeLive{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes ndLive{0%,100%{opacity:.45;r:var(--nr)}50%{opacity:1}}
    .net .edge{stroke:var(--netLine);stroke-width:1;animation:edgeLive 9s ease-in-out infinite}
    .net .nd{fill:var(--netDot);animation:ndLive 7s ease-in-out infinite}
    @keyframes sig0{0%{transform:translate(0,0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translate(157.1px,-2.0px);opacity:0}}
    .net .g0{animation:sig0 3.4s cubic-bezier(.45,0,.55,1) 0.0s infinite}
    @keyframes sig1{0%{transform:translate(0,0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translate(146.6px,10.8px);opacity:0}}
    .net .g1{animation:sig1 4.3s cubic-bezier(.45,0,.55,1) 1.3s infinite}
    @keyframes sig2{0%{transform:translate(0,0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translate(4.5px,119.1px);opacity:0}}
    .net .g2{animation:sig2 5.2s cubic-bezier(.45,0,.55,1) 2.6s infinite}
    .net .sig{fill:var(--netSig)}
    @media (prefers-reduced-motion:reduce){.net .edge,.net .nd,.net .sig{animation:none!important}.net .sig{opacity:0}}

    @media (prefers-reduced-motion: reduce){
      .in,.arrow,.halo,.sheen,.pill,.runner{animation:none!important}
      .runner{opacity:0}
      .in{opacity:1}
      .sheen{display:none}
    }
  </style>
  <radialGradient id="wash2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="var(--v)" stop-opacity="var(--washA)"/>
    <stop offset="100%" stop-color="var(--v)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sheenGrad2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sheenC)" stop-opacity="0"/>
    <stop offset="50%" stop-color="var(--sheenC)" stop-opacity="var(--sheenA)"/>
    <stop offset="100%" stop-color="var(--sheenC)" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="runner2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="var(--v)" stop-opacity="0"/>
    <stop offset="50%" stop-color="var(--v)" stop-opacity=".85"/>
    <stop offset="100%" stop-color="var(--c)" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="r2"><rect x=".75" y=".75" width="1278.5" height="178.5" rx="16"/></clipPath>
  <clipPath id="titleClip">
    <text class="f" x="640" y="100" text-anchor="middle" font-size="34" font-weight="600" letter-spacing="-.9">Have an interesting problem? Let's talk.</text>
  </clipPath>
</defs>

<g clip-path="url(#r2)">
  <rect width="1280" height="180" fill="var(--bg)"/>
  <ellipse class="halo" cx="640" cy="200" rx="560" ry="170" fill="url(#wash2)"/>

  <g class="net" opacity=".45">
    <line class="edge" style="animation-delay:0.00s" x1="74.8" y1="56.1" x2="231.8" y2="54.1"/>
