<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Aadithya Chandramouli — CS senior at Penn State, building AI systems.">
<defs>
  <style>
:root{
  --bg:#FFFFFF; --border:#D1D9E0;
  --v:#7C3AED; --c:#0E7490; --live:#059669; --washA:.05;
  --nameA:#0D0E11; --text:#33373F; --muted:#565C68; --dim:#666C79;
  --sheenC:#A78BFA; --sheenA:.55; --washB:.05; --pillLit:#A78BFA;
  --gridC:#0D1117; --gridA:.04;
  --label:#666C79; --sep:#C6CAD2; --chipStroke:#D8DCE2;
}
    .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace}

    /* entrance — every element is visible at rest; `backwards` hides it only during its delay */
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .in{animation:rise .6s cubic-bezier(.16,.84,.24,1) backwards}
    .d2{animation-delay:.07s}.d3{animation-delay:.15s}
    .d4{animation-delay:.26s}.d5{animation-delay:.34s}

    /* drifting grid */
    @keyframes pan{from{transform:translate(0,0)}to{transform:translate(40px,40px)}}
    .grid{animation:pan 30s linear infinite}

    /* ambient washes */
    @keyframes drift{0%,100%{opacity:.7;transform:translate(0,0)}50%{opacity:1;transform:translate(-30px,16px)}}
    .wash{animation:drift 16s ease-in-out infinite}

    /* light flowing through the letters of the name */
    @keyframes flow{from{transform:translateX(0)}to{transform:translateX(560px)}}
    .flow{animation:flow 7s linear infinite}

    /* white highlight sweeping across the name */
    @keyframes sheen{0%{transform:translateX(-280px)}38%,100%{transform:translateX(760px)}}
    .sheen{animation:sheen 11s cubic-bezier(.45,0,.3,1) 2s infinite}

    /* accent rule under the name */
    @keyframes ruleGrow{0%,100%{transform:scaleX(1);opacity:.7}50%{transform:scaleX(1.55);opacity:1}}
    .accentRule{transform-box:fill-box;transform-origin:left center;
      animation:ruleGrow 7s cubic-bezier(.4,0,.3,1) infinite}

    /* rising motes */
    @keyframes mote{0%{transform:translateY(0);opacity:0}14%{opacity:.65}86%{opacity:.4}100%{transform:translateY(-200px);opacity:0}}
    .mote{animation:mote 15s linear infinite}

    /* light running the border */
    @keyframes runBorder{to{stroke-dashoffset:-3160}}
    .runner{stroke-dasharray:220 2940;animation:runBorder 9s linear infinite}

    /* typewriter — generated by build.sh from the PHRASE_* lines */
    .t{transform-box:fill-box;transform-origin:left center}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .blink{animation:blink 1.05s steps(1,end) infinite}
    @keyframes type0{0%{transform:scaleX(0);animation-timing-function:steps(45,end)}10.185%{transform:scaleX(1);animation-timing-function:linear}24.074%{transform:scaleX(1);animation-timing-function:steps(45,end)}30.093%{transform:scaleX(0)}100%{transform:scaleX(0)}}
    @keyframes caret0{0%{opacity:1;transform:translateX(0);animation-timing-function:steps(45,end)}10.185%{opacity:1;transform:translateX(585px);animation-timing-function:linear}24.074%{opacity:1;transform:translateX(585px);animation-timing-function:steps(45,end)}30.093%{opacity:1;transform:translateX(0)}30.278%{opacity:0;transform:translateX(0)}100%{opacity:0}}
    .t0{animation:type0 21600ms linear infinite}
    .c0{animation:caret0 21600ms linear infinite}
    @keyframes type1{0%{transform:scaleX(0)}33.333%{transform:scaleX(0);animation-timing-function:steps(43,end)}43.519%{transform:scaleX(1);animation-timing-function:linear}57.407%{transform:scaleX(1);animation-timing-function:steps(43,end)}63.426%{transform:scaleX(0)}100%{transform:scaleX(0)}}
    @keyframes caret1{0%{opacity:0;transform:translateX(0)}33.333%{opacity:1;transform:translateX(0);animation-timing-function:steps(43,end)}43.519%{opacity:1;transform:translateX(559px);animation-timing-function:linear}57.407%{opacity:1;transform:translateX(559px);animation-timing-function:steps(43,end)}63.426%{opacity:1;transform:translateX(0)}63.611%{opacity:0;transform:translateX(0)}100%{opacity:0}}
    .t1{animation:type1 21600ms linear infinite}
    .c1{animation:caret1 21600ms linear infinite}
    .t1{transform:scaleX(0)}
    .c1{opacity:0}
    @keyframes type2{0%{transform:scaleX(0)}66.667%{transform:scaleX(0);animation-timing-function:steps(29,end)}76.852%{transform:scaleX(1);animation-timing-function:linear}90.741%{transform:scaleX(1);animation-timing-function:steps(29,end)}96.759%{transform:scaleX(0)}100%{transform:scaleX(0)}}
    @keyframes caret2{0%{opacity:0;transform:translateX(0)}66.667%{opacity:1;transform:translateX(0);animation-timing-function:steps(29,end)}76.852%{opacity:1;transform:translateX(377px);animation-timing-function:linear}90.741%{opacity:1;transform:translateX(377px);animation-timing-function:steps(29,end)}96.759%{opacity:1;transform:translateX(0)}96.944%{opacity:0;transform:translateX(0)}100%{opacity:0}}
    .t2{animation:type2 21600ms linear infinite}
    .c2{animation:caret2 21600ms linear infinite}
    .t2{transform:scaleX(0)}
    .c2{opacity:0}

    @media (prefers-reduced-motion: reduce){
      .in,.grid,.wash,.flow,.sheen,.accentRule,.mote,.runner,.blink,.t,.cw{animation:none!important}
      .cw,.mote,.runner{opacity:0}
      .accentRule{transform:none}
      .t{transform:none!important}
      .tHide{display:none}
    }
  </style>

  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--v)"/>
    <stop offset="100%" stop-color="var(--c)"/>
  </linearGradient>

  <!-- one accent band per 560px, repeated three times so the translate loops seamlessly -->
  <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0.000" stop-color="var(--nameA)"/>
    <stop offset="0.180" stop-color="var(--nameA)"/>
    <stop offset="0.240" stop-color="var(--v)"/>
    <stop offset="0.290" stop-color="var(--c)"/>
    <stop offset="0.333" stop-color="var(--nameA)"/>
    <stop offset="0.513" stop-color="var(--nameA)"/>
    <stop offset="0.573" stop-color="var(--v)"/>
    <stop offset="0.623" stop-color="var(--c)"/>
    <stop offset="0.666" stop-color="var(--nameA)"/>
    <stop offset="0.846" stop-color="var(--nameA)"/>
    <stop offset="0.906" stop-color="var(--v)"/>
    <stop offset="0.956" stop-color="var(--c)"/>
    <stop offset="1.000" stop-color="var(--nameA)"/>
  </linearGradient>

  <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sheenC)" stop-opacity="0"/>
    <stop offset="50%" stop-color="var(--sheenC)" stop-opacity="var(--sheenA)"/>
    <stop offset="100%" stop-color="var(--sheenC)" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="runnerGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="var(--c)" stop-opacity="0"/>
    <stop offset="50%" stop-color="var(--c)" stop-opacity=".9"/>
    <stop offset="100%" stop-color="var(--v)" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="wash" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="var(--v)" stop-opacity="var(--washA)"/>
    <stop offset="100%" stop-color="var(--v)" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="wash2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="var(--c)" stop-opacity="var(--washB)"/>
    <stop offset="100%" stop-color="var(--c)" stop-opacity="0"/>
  </radialGradient>

  <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="var(--gridC)" stroke-opacity="var(--gridA)" stroke-width="1"/>
  </pattern>

  <clipPath id="round"><rect x=".75" y=".75" width="1278.5" height="298.5" rx="16"/></clipPath>
  <clipPath id="nameClip">
    <text class="f" x="72" y="128" font-size="60" font-weight="600" letter-spacing="-1.8">Aadithya Chandramouli</text>
  </clipPath>
</defs>

<g clip-path="url(#round)">
  <rect width="1280" height="300" fill="var(--bg)"/>
  <g class="grid"><rect x="-40" y="-40" width="1360" height="380" fill="url(#gridP)"/></g>

  <ellipse class="wash" cx="1120" cy="30" rx="460" ry="250" fill="url(#wash)"/>
  <ellipse class="wash" cx="980" cy="310" rx="380" ry="190" fill="url(#wash2)" style="animation-delay:-8s"/>

  <g fill="var(--c)">
    <circle class="mote" cx="392" cy="284" r="1.6" opacity="0"/>
    <circle class="mote" cx="668" cy="298" r="1.2" opacity="0" style="animation-delay:-4s;animation-duration:19s"/>
    <circle class="mote" cx="842" cy="276" r="1.8" opacity="0" style="animation-delay:-9s;animation-duration:17s"/>
    <circle class="mote" cx="1044" cy="306" r="1.3" opacity="0" style="animation-delay:-13s;animation-duration:21s"/>
    <circle class="mote" cx="1188" cy="288" r="1.5" opacity="0" style="animation-delay:-6s;animation-duration:16s"/>
  </g>

  <g class="in d2">
    <text class="f" x="72" y="128" font-size="60" font-weight="600" letter-spacing="-1.8" fill="var(--nameA)">Aadithya Chandramouli</text>
    <g clip-path="url(#nameClip)">
      <rect class="flow" x="-488" y="68" width="1680" height="76" fill="url(#flowGrad)"/>
      <rect class="sheen" x="0" y="68" width="140" height="76" fill="url(#sheenGrad)"/>
    </g>
  </g>

  <rect class="in d3 accentRule" x="72" y="152" width="72" height="2" rx="1" fill="url(#rule)"/>

  <clipPath id="tc0"><rect class="t t0" x="72" y="172" width="597" height="34"/></clipPath>
  <g clip-path="url(#tc0)"><text class="f" x="72" y="196" font-size="25" font-weight="450" letter-spacing="-.3" fill="var(--text)">CS senior at Penn State, building AI systems.</text></g>
  <g class="cw c0"><rect class="blink" x="74" y="176" width="2" height="26" fill="var(--c)"/></g>
  <clipPath id="tc1"><rect class="t t1" x="72" y="172" width="571" height="34"/></clipPath>
  <g class="tHide">
  <g clip-path="url(#tc1)"><text class="f" x="72" y="196" font-size="25" font-weight="450" letter-spacing="-.3" fill="var(--text)">I turn research ideas into things that run.</text></g>
  <g class="cw c1"><rect class="blink" x="74" y="176" width="2" height="26" fill="var(--c)"/></g>
  </g>
  <clipPath id="tc2"><rect class="t t2" x="72" y="172" width="389" height="34"/></clipPath>
  <g class="tHide">
  <g clip-path="url(#tc2)"><text class="f" x="72" y="196" font-size="25" font-weight="450" letter-spacing="-.3" fill="var(--text)">Currently building HydroNode.</text></g>
  <g class="cw c2"><rect class="blink" x="74" y="176" width="2" height="26" fill="var(--c)"/></g>
  </g>

  <text class="f in d4" x="72" y="232" font-size="16" fill="var(--muted)">Machine learning · Backend systems · Interfaces people actually enjoy</text>

  <g transform="translate(72,258)"><g class="in d5">
    <text class="m" x="0" y="12" font-size="12" letter-spacing=".8" fill="var(--dim)">INDIA</text>
    <text class="m" x="62" y="12" font-size="12" letter-spacing=".8" fill="var(--sep)">/</text>
    <text class="m" x="80" y="12" font-size="12" letter-spacing=".8" fill="var(--dim)">PENN STATE · COMPUTER SCIENCE</text>
    <text class="m" x="386" y="12" font-size="12" letter-spacing=".8" fill="var(--sep)">/</text>
    <text class="m" x="404" y="12" font-size="12" letter-spacing=".8" fill="var(--dim)">GITHUB.COM/AADYCM</text>
  </g></g>
</g>
<rect x=".75" y=".75" width="1278.5" height="298.5" rx="16" fill="none" stroke="var(--border)" stroke-width="1.5"/>
<rect class="runner" x=".75" y=".75" width="1278.5" height="298.5" rx="16" fill="none" stroke="url(#runnerGrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
