    <g transform="translate(331,0)"><g class="chip" style="animation-delay:340ms"><rect class="chipR" style="animation-delay:4277ms" width="75" height="28" rx="14" fill="none" stroke="var(--chipStroke)"/><text class="f" x="37" text-anchor="middle" y="19" font-size="12.5" font-weight="450" fill="var(--text)">Node.js</text></g></g>
