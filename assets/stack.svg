<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 434" width="1280" height="434" role="img" aria-label="Tech stack by category">
  <defs>
    <style>
:root{
  --bg:#0D1117; --border:#30363D;
  --v:#8B5CF6; --c:#22D3EE; --live:#34D399; --washA:.13;
  --nameA:#F4F5F8; --text:#D7DAE1; --muted:#A8AEBB; --dim:#8F96A4;
  --sheenC:#FFFFFF; --sheenA:.75; --washB:.10; --pillLit:#4A5568;
  --gridC:#FFFFFF; --gridA:.022;
  --label:#8F96A4; --sep:#41454F; --chipStroke:#363C45;
  --panel:#11161D; --wire:#3A4250; --dotOff:#3A4250;
}
      .f{font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
      @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
      @keyframes scan{0%{transform:translateX(0)}55%,100%{transform:translateX(1700px)}}
      @keyframes chipGlow{0%,100%{stroke:var(--chipStroke)}2%{stroke:var(--v)}3%{stroke:var(--v)}7%{stroke:var(--chipStroke)}}
      @keyframes drawLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .in{animation:rise .7s cubic-bezier(.16,.84,.24,1) backwards}
      .chip{animation:pop .5s cubic-bezier(.16,.84,.24,1) backwards}
      .chipR{animation:chipGlow 14000ms linear infinite}
      .hair{transform-box:fill-box;transform-origin:left center;
        animation:drawLine .9s cubic-bezier(.16,.84,.24,1) backwards}
      .scan{animation:scan 14000ms linear 2000ms infinite}
      @media (prefers-reduced-motion:reduce){
        .in,.chip,.chipR,.hair,.scan{animation:none!important}
        .scan{display:none}
        .hair{transform:none}
      }
    </style>
    <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--v)" stop-opacity="0"/>
      <stop offset="50%" stop-color="var(--v)" stop-opacity=".10"/>
      <stop offset="100%" stop-color="var(--v)" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelClip"><rect x=".75" y=".75" width="1278.5" height="432" rx="16"/></clipPath>
  </defs>
  <rect width="1280" height="434" fill="var(--bg)"/>
  <rect x=".75" y=".75" width="1278.5" height="432.5" rx="16" fill="none" stroke="var(--border)" stroke-width="1.5"/>
  <g transform="translate(0,52)"><g class="in" style="animation-delay:0ms">
    <text class="m" x="72" y="20" font-size="11.5" letter-spacing="1.6" fill="var(--label)">LANGUAGES</text>
    <g transform="translate(248,0)"><g class="chip" style="animation-delay:120ms"><rect class="chipR" style="animation-delay:3887ms" width="68" height="28" rx="14" fill="none" stroke="var(--chipStroke)"/><text class="f" x="34" text-anchor="middle" y="19" font-size="12.5" font-weight="450" fill="var(--text)">Python</text></g></g>
    <g transform="translate(324,0)"><g class="chip" style="animation-delay:160ms"><rect class="chipR" style="animation-delay:4295ms" width="96" height="28" rx="14" fill="none" stroke="var(--chipStroke)"/><text class="f" x="48" text-anchor="middle" y="19" font-size="12.5" font-weight="450" fill="var(--text)">TypeScript</text></g></g>
    <g transform="translate(428,0)"><g class="chip" style="animation-delay:200ms"><rect class="chipR" style="animation-delay:4671ms" width="54" height="28" rx="14" fill="none" stroke="var(--chipStroke)"/><text class="f" x="27" text-anchor="middle" y="19" font-size="12.5" font-weight="450" fill="var(--text)">Java</text></g></g>
    <g transform="translate(490,0)"><g class="chip" style="animation-delay:240ms"><rect class="chipR" style="animation-delay:4902ms" width="33" height="28" rx="14" fill="none" stroke="var(--chipStroke)"/><text class="f" x="16" text-anchor="middle" y="19" font-size="12.5" font-weight="450" fill="var(--text)">C</text></g></g>
