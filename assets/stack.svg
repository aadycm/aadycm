    <g transform="translate(449,0)"><g class="chip" style="animation-delay:290ms"><rect class="chipR" style="animation-delay:4843ms" width="89" height="28" rx="14" fill="none" stroke="var(--chipStroke)"/><text class="f" x="44" text-anchor="middle" y="19" font-size="12.5" font-weight="450" fill="var(--text)">LangChain</text></g></g>
