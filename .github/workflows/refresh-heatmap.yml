# keeps the commit log heatmap and snake in step with the real contribution calendar
name: refresh heatmap

on:
  schedule:
    # 06:17 utc which is the early hours in pennsylvania
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-heatmap.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/refresh.py
      - name: commit if anything changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # the bot is the author so these commits do not count on the contribution calendar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh commit log heatmap"
          git pull --rebase origin main
          git push origin main
